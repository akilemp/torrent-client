[package]
name = "torrent-client"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
rand = "0.9.2"
serde = { version = "^1.0", features = ["derive"] }
serde_bencode = "^0.2.4"
serde_bytes = "^0.11" # For efficiently handling the 'pieces' byte string
sha1 = "^0.10.6"
url = "2.5.7"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }